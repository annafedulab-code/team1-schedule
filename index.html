<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AI Healthcare 1조 6명의 모임 시간을 함께 확인하는 일정표">
<meta name="theme-color" content="#ffffff">
<title>1조 모임 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<script src="firebase-config.js?v=3"></script>
</head>
<body>
<main class="band">
  <h1>1조 모임 시간표</h1>
  <p class="lead">AI Healthcare 1조 · 6명의 모임 가능 시간을 함께 확인하는 일정표</p>

  <section id="loginView" class="login">
    <label for="selName">이름</label>
    <select id="selName"><option value="">이름 선택</option></select>
    <label for="inpPin">전화번호 끝 4자리</label>
    <input id="inpPin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    <p class="err" id="loginErr"></p>
    <button class="btn pri" id="btnLogin">입장</button>
  </section>

  <section id="appView" class="hidden">
    <div class="bar">
      <span class="who" id="whoName"></span>
      <span class="status" id="status"></span>
      <button class="btn" id="btnLogout">나가기</button>
    </div>
    <div class="tabs">
      <button class="btn" id="tabEdit" aria-pressed="true">내 시간 칠하기</button>
      <button class="btn" id="tabSum" aria-pressed="false">취합 결과</button>
    </div>

    <div id="editView">
      <div class="pens" role="group" aria-label="칠하기 색">
        <button class="btn pen" data-pen="g" aria-pressed="true"><i style="background:var(--g)"></i>온·오프라인</button>
        <button class="btn pen" data-pen="y" aria-pressed="false"><i style="background:var(--y)"></i>온라인만</button>
        <button class="btn pen" data-pen="" aria-pressed="false"><i></i>지우기</button>
      </div>
      <div class="scroll"><table id="gridEdit"></table></div>
      <p class="hint">칸을 누르거나 드래그해서 칠하면 자동 저장됩니다. 녹색 = 대면·비대면 모두 가능, 노란색 = 온라인(비대면)만 가능.</p>
    </div>

    <div id="sumView" class="hidden">
      <div class="legend">
        <span><i style="background:var(--g)"></i>숫자 = 참여 가능 인원(녹+노)</span>
        <span><i style="outline:2px solid var(--ink)"></i>6명 전원 가능</span>
      </div>
      <div class="members" id="memberState"></div>
      <div class="scroll"><table id="gridSum" class="sum"></table></div>
      <div class="panel" id="cellInfo"><h3>칸을 누르면 누가 가능한지 보여요</h3></div>
      <div class="panel">
        <h3>추천 시간대</h3>
        <ol class="best" id="bestList"></ol>
        <button class="btn" id="btnCopy">결과 텍스트 복사</button>
        <span class="status" id="copyMsg"></span>
      </div>
    </div>
  </section>
</main>

<script type="module" src="app.js?v=3"></script>
</body>
</html>
